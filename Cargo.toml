[package]
name = "webhookr"
version = "0.1.0"
edition = "2021"
description = "Self-hosted webhook runner: trigger git pull + deploy commands from GitHub webhooks"
license = "MIT"

[[bin]]
name = "webhookr"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "5"
hex = "0.4"
hmac = "0.12"
maud = { version = "0.27", features = ["axum"] }
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
